name: macOS
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test Swift and WebDAV
        run: python3 scripts/verify-webdav.py
      - name: Build desktop application
        run: bash scripts/build-app.sh
